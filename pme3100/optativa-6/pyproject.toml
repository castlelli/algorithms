[project]
name = "carrossel"
version = "1.0.0"
description = "PME3100 · Carrossel e formiga: cinemática do movimento relativo, animação e relatório em PDF"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "sympy", "matplotlib", "jinja2", "pillow"]

[project.optional-dependencies]
teste = ["pytest"]

[project.scripts]
carrossel = "carrossel.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carrossel"]

[tool.setuptools.package-data]
carrossel = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Interna do mpmath (chamada pelo sympy.integrate), fora do nosso controle.
    "ignore:bitcount function is deprecated:DeprecationWarning",
]
